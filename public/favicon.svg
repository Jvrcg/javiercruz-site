<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Full black square: serves as frame border and J fill color -->
  <rect width="100" height="100" fill="#000"/>
  <!--
    White negative-space cutout:
    - Rectangular void from top-left (3,3) to where the J stem begins (84,3),
      down the left side to hook entry (84,65)
    - Then the inner arc of the J hook: semicircle center=(63,65) r=21,
      sweeping clockwise from (84,65) down through (63,86) to (42,65)
    - Back left across the bottom of the void to (3,65)
    - Up the left edge to (3,3)
    The right strip (x 84-100) stays black = the J stem / right frame border.
    The hook outer arc sweeps below the frame, extending to y≈98.
  -->
  <path d="M 3 3 L 84 3 L 84 65 A 21 21 0 0 1 42 65 L 3 65 Z" fill="#fff"/>
</svg>
